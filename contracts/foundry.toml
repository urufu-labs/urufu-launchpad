[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"

solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
via_ir = true

# Allow reading + writing local fixture files (test outputs, epoch JSONs).
fs_permissions = [
  { access = "read", path = "./" },
  { access = "write", path = "./" },
]

[fuzz]
runs = 1_000
max_test_rejects = 65_536

[invariant]
runs = 256
depth = 32
# Kept at false because BondingCurveInvariant + the WL solvency invariant use
# handlers that legitimately probe out-of-band actions (e.g. buys that would
# push past the reserve floor). Individual handlers wrap their actions in
# vm.assume() bounds so reverts still exercise honest boundary conditions,
# not silent noise.
#
# URU-A14 additional-defect concern (auditor page 10, "Invariant tests
# tolerate reverts"): the `strict` profile below flips this to true so at
# least one CI job proves successful-path liveness. Solvency invariants that
# encode "action X on state Y must succeed" belong in that profile.
fail_on_revert = false
call_override = false

# URU-A14 additional: strict invariant profile — every handler call MUST
# succeed. Run this against the WL solvency invariant + curve reachability
# fuzz to prove liveness end to end. CI runs both `default` and `strict`.
[profile.strict]

[profile.strict.invariant]
runs = 512
depth = 48
fail_on_revert = true
call_override = false

# Clone profile — used when compiling contracts that get cloned by factories.
# Small optimizer runs → tighter bytecode, cheaper CREATE2 clone deploys.
# Selected explicitly by the compile-service when building templates.
[profile.clone]
optimizer_runs = 200
via_ir = true

# CI profile — heavier fuzz and invariant budgets.
[profile.ci]

[profile.ci.fuzz]
runs = 10_000

[profile.ci.invariant]
runs = 1_024
depth = 64

# Formatting rules — match HANDOFF.md §Solidity style.
[fmt]
bracket_spacing = false
int_types = "long"
line_length = 120
multiline_func_header = "params_first"
number_underscore = "thousands"
quote_style = "double"
tab_width = 4
wrap_comments = true

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
# Robinhood Chain uses Blockscout; key can be any non-empty string for public endpoints.
# Override with a real key once Blockscout Pro is set up.
robinhood = { key = "${BLOCKSCOUT_API_KEY:-none}", url = "https://robinhoodchain.blockscout.com/api", chain = 4663 }
robinhood_testnet = { key = "${BLOCKSCOUT_API_KEY:-none}", url = "https://robinhoodchain-testnet.blockscout.com/api", chain = 46630 }

# Coverage profile — forge coverage disables optimization for source accuracy.
# We enable via_ir with minimal optimization runs so viaIR pipeline has room
# to lay out stack slots for functions with many locals (the launch entrypoints
# and some template composites push past the standard 16-slot limit without it).
[profile.coverage]
via_ir = true
optimizer = true
optimizer_runs = 1
