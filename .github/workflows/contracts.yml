name: contracts
on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
        env:
          # foundryup calls GitHub API to fetch latest release tags. Anonymous calls
          # get 60/hr — the GH runners share IPs so we hit HTTP 403 rate-limits on
          # every other push. Passing GITHUB_TOKEN lifts the limit to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show forge version
        run: forge --version
      - name: Format check
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Test (CI profile — high fuzz runs)
        run: FOUNDRY_PROFILE=ci forge test -vvv
      - name: Coverage summary
        # --ir-minimum enables viaIR with minimum optimization. Several launch-related
        # functions still trip solc's stack limit even with the workaround (the
        # instrumented decode wrappers exceed 16-slot stack pressure). Non-blocking so
        # merges aren't gated on a known solc/foundry interaction — the full test
        # suite above is the correctness gate. See
        # https://book.getfoundry.sh/guides/best-practices/stack-too-deep and
        # https://github.com/foundry-rs/foundry/issues/3357
        continue-on-error: true
        run: forge coverage --report summary --ir-minimum
      # URU-A14 additional: security.sh runs Slither over src/ + script/ and
      # fails hard on analyzer error (the `|| true` swallow was removed).
      # Slither is python-installed here since the foundry-toolchain image
      # doesn't carry it. Blocks merge on any HIGH/MEDIUM regression.
      - name: Install Slither
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install slither-analyzer
      - name: Slither (src + script)
        # Belt-and-braces: invoke via `bash` so a stripped exec bit (Windows
        # git checkouts drop +x by default) doesn't 126-error the whole job.
        # The tracked mode is now 100755 too via `git update-index --chmod=+x`.
        run: bash security.sh
