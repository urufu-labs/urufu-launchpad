name: compile-service
on:
  push:
    branches: [main]
    paths:
      - 'compile-service/**'
      - '.github/workflows/compile-service.yml'
  pull_request:
    paths:
      - 'compile-service/**'
      - '.github/workflows/compile-service.yml'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v7
        with:
          # Node 22+ needed for --experimental-strip-types (TypeScript sources
          # loaded directly by the test runner). Local dev is on Node 22+ too.
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vm/compile-service typecheck
      - run: pnpm --filter @vm/compile-service build
      # URU-A06 / URU-A07: publisher crash-recovery + partial-epoch tests.
      # URU-A09 AC #4: no-drift check for the module matrix — fails if any
      # canonical ConfigId computed by the shared library isn't present in
      # RhConfigManifest.sol (or if the manifest carries an unlisted hash).
      # Uses node --test with --experimental-strip-types (Node 22+) to run
      # TypeScript sources directly, matching the local dev flow.
      - name: Run compile-service tests (rewards + manifest drift)
        working-directory: compile-service
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning --test 'src/**/*.test.ts'
